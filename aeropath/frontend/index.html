<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroPath AI — Smart Mobility Command</title>
  <script>
    if(!localStorage.getItem('aeropath_auth')) window.location.href='login.html';
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <h1><span>🛣</span> AeroPath AI</h1>
      <span id="data-source-badge">📡 LIVE</span>
    </div>
    <div style="display:flex;align-items:center;gap:20px;">
      <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);">
        <input type="checkbox" id="voice-toggle" checked style="accent-color:var(--accent-blue)"/>
        <label for="voice-toggle">Voice</label>
      </div>
      <div id="user-display" style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;">
        <span id="user-email">admin@aeropath.ai</span>
        <button onclick="logout()" style="background:transparent;border:1px solid var(--border-color);color:var(--accent-red);padding:2px 8px;border-radius:4px;font-size:10px;cursor:pointer;">Logout</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    
    <!-- LEFT SIDEBAR: ROUTE & INTEL -->
    <div class="sidebar">

      <!-- SMART ROUTE SEARCH -->
      <div class="panel route-search-panel">
        <h3 style="margin-bottom:12px;color:var(--accent-blue);">🛰 Smart Pathfinding</h3>
        
        <div class="input-group">
          <label>From (Auto-detected)</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="route-origin-str" class="input-modern" placeholder="Detecting location..." list="junction-options">
            <button class="btn-icon" title="Refresh Location" onclick="detectLocation()">🔄</button>
          </div>
          <input type="hidden" id="route-origin-id">
        </div>

        <datalist id="junction-options">
          <option value="MG Road">
          <option value="Koramangala">
          <option value="Indiranagar">
          <option value="Rajajinagar">
          <option value="HSR Layout">
        </datalist>

        <div class="input-group" style="margin-top:14px;">
          <label id="lbl-mode">Transportation Mode</label>
          <div class="mode-selector">
             <button class="mode-btn active" onclick="setMode('car')" title="Car">🚗</button>
             <button class="mode-btn" onclick="setMode('bike')" title="Bike">🚲</button>
             <button class="mode-btn" onclick="setMode('bus')" title="Bus">🚌</button>
          </div>
        </div>

        <div class="input-group" style="margin-top:14px;">
          <label id="lbl-to">To (Global Search)</label>
          <input type="text" id="route-dest-search" class="input-modern" placeholder="Any address worldwide..." oninput="fetchSuggestions(this.value)" autocomplete="off">
          <div id="dest-autocomplete-list" class="autocomplete-items"></div>
        </div>

        <button class="btn-primary" id="btn-route" style="margin-top:16px;" onclick="planRouteGlobal()">🗺 Find Shorter Route</button>
      </div>

      <!-- ROUTE RESULTS -->
      <div id="route-results-area" style="display:none;">
        <div class="panel result-panel active-result">
          <div class="result-header">
            <span class="badge badge-success">SHORTER WAY FOUND</span>
            <span class="save-time" id="saving-time">-- min</span>
          </div>
          <div class="route-meta">
             <span id="route-dist">-- km</span> • <span id="route-time">-- min</span>
          </div>
          <div class="route-path" id="route-path-display">-- → --</div>
          <div class="reason-box">
             <div class="reason-label">PROPER REASON</div>
             <div id="route-reason">Scanning traffic patterns...</div>
          </div>
          <div style="margin-top:12px;">
            <canvas id="routeChartSmall" height="80"></canvas>
          </div>
        </div>
      </div>

      <!-- NODE PERFORMANCE -->
      <div class="panel" style="flex:1; overflow:auto;">
        <div class="panel-header"><h3>Network Nodes</h3></div>
        <div id="junction-list" class="junction-grid-compact">Loading telemetry...</div>
      </div>

    </div>

    <!-- CENTER: THE LIVE MAP -->
    <div class="map-container">
      <div id="map"></div>
      
      <!-- TOP OVERLAYS -->
      <div class="map-overlay-top">
        <div id="clock">--:--:--</div>
        <div id="active-ambulance-alert" style="display:none;">
          🚑 EMERGENCY: Preemption Active
        </div>
      </div>

      <!-- BOTTOM OVERLAYS (TELEMETRY) -->
      <div class="telemetry-bar">
        <div class="tel-item"><span class="label">AVG DENSITY</span><span class="val" id="density-val">--%</span></div>
        <div class="tel-item"><span class="label">NODES</span><span class="val">5/5</span></div>
        <div class="tel-item"><span class="label">TELEMETRY</span><span class="val val-green" id="ingest-status">● STREAMING</span></div>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE WIDGETS (Tabbed Panel) -->
  <div id="widget-tray">
     <button class="widget-btn" onclick="toggleWidget('chatbot')">💬 AI</button>
     <button class="widget-btn" onclick="toggleWidget('telemetry')">📡 LOG</button>
     <button class="widget-btn" onclick="toggleWidget('forecast')">🔮 FC</button>
  </div>

  <div id="widget-panel" class="panel glass-floating" style="display:none;">
    <div class="panel-header">
      <h3 id="widget-title">Widget</h3>
      <button onclick="toggleWidget()" style="background:transparent;border:none;color:var(--text-dim);cursor:pointer;">✕</button>
    </div>
    <div id="widget-content"></div>
  </div>

  <div id="lang-switcher">
     <button onclick="setLang('en')">EN</button>
     <button onclick="setLang('hi')">HI</button>
     <button onclick="setLang('kn')">KN</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    const API = "http://localhost:5000";
    const markers = {};
    let ambulanceMarker = null;
    let routeChart = null;
    let currentPath = null;
    let routingControl = null;
    let currentMode = 'car';
    let currentLang = 'en';

    const translations = {
      en: { title:"AeroPath AI", find:"Find Shorter Route", from:"From (Auto-detected)", to:"To (Global Search)", mode:"Transportation Mode", saved:"min saved", reason:"PROPER REASON" },
      hi: { title:"एयरोपाथ AI", find:"छोटा रास्ता खोजें", from:"से (स्वचालित)", to:"तक (वैश्विक खोज)", mode:"परिवहन मोड", saved:"मिनट बचाए", reason:"उचित कारण" },
      kn: { title:"ಏರೋಪಾತ್ AI", find:"ಸಣ್ಣ ಮಾರ್ಗ ಪತ್ತೆ ಮಾಡಿ", from:"ಇಂದ (ಸ್ವಯಂಚಾಲಿತ)", to:"ವರೆಗೆ (ಜಾಗತಿಕ ಹುಡುಕಾಟ)", mode:"ಸಾರಿಗೆ ವಿಧಾನ", saved:"ನಿಮಿಷ ಉಳಿಸಲಾಗಿದೆ", reason:"ಸರಿಯಾದ ಕಾರಣ" }
    };

    function setLang(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.querySelector('h1 span').nextSibling.textContent = " " + t.title;
      document.getElementById('lbl-mode').textContent = t.mode;
      document.getElementById('lbl-to').textContent = t.to;
      document.getElementById('btn-route').textContent = "🗺 " + t.find;
      document.querySelectorAll('#lang-switcher button').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(lang)));
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.title.toLowerCase() === mode));
      speak(`Mode changed to ${mode}`);
    }

    // --- AUTOCOMPLETE ---
    let debounceTimer;
    async function fetchSuggestions(query) {
      const list = document.getElementById("dest-autocomplete-list");
      if (!query || query.length < 3) { list.innerHTML = ""; return; }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
          const data = await res.json();
          
          list.innerHTML = "";
          data.forEach(item => {
            const div = document.createElement("div");
            const mainText = item.display_name.split(',')[0];
            const subText = item.display_name.split(',').slice(1).join(',').substring(0, 60);
            div.innerHTML = `<strong>${mainText}</strong><br><small style="color:#8b949e">${subText}...</small>`;
            
            // On click, set input value and clear suggestions
            div.onclick = function() {
              document.getElementById("route-dest-search").value = item.display_name;
              list.innerHTML = "";
            };
            list.appendChild(div);
          });
        } catch(err) { console.error("Autocomplete error:", err); }
      }, 400); // 400ms debounce typing
    }

    // Close autocomplete when clicking outside
    document.addEventListener("click", function(e) {
      if(e.target.id !== "route-dest-search") {
        const list = document.getElementById("dest-autocomplete-list");
        if(list) list.innerHTML = "";
      }
    });

    // --- GEOLOCATION ---
    function detectLocation() {
      const originEl = document.getElementById("route-origin-str");
      originEl.value = "Detecting location...";
      if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`).then(r=>r.json());
          const name = res.display_name.split(',')[0] || "Current Location";
          originEl.value = name;
          originEl.dataset.lat = lat; originEl.dataset.lng = lng;
          speak(`Location detected at ${name}`);
        }, () => {
          originEl.value = "MG Road, Bengaluru";
          originEl.dataset.lat = 12.9716; originEl.dataset.lng = 77.5946;
        });
      }
    }

    // --- GLOBAL ROUTING ---
    async function planRouteGlobal() {
      const originEl = document.getElementById("route-origin-str");
      const destStr = document.getElementById("route-dest-search").value;
      if(!destStr) { alert("Please enter a destination"); return; }

      // 1. Geocode Destination
      const destRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destStr)}`).then(r=>r.json());
      if(!destRes.length) { alert("Destination not found"); return; }
      const dest = destRes[0];

      // 1b. Ensure Origin is geocoded
      let startLat = originEl.dataset.lat, startLng = originEl.dataset.lng;
      if(!startLat) {
        const originRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(originEl.value)}`).then(r=>r.json());
        if(originRes.length) { startLat = originRes[0].lat; startLng = originRes[0].lon; }
        else { startLat = 12.9716; startLng = 77.5946; } // Default MG Road
      }

      const start = L.latLng(startLat, startLng);
      const end = L.latLng(dest.lat, dest.lon);

      if(routingControl) map.removeControl(routingControl);
      
      routingControl = L.Routing.control({
        waypoints: [start, end],
        lineOptions: { styles: [{ color: '#1a73e8', weight: 6, opacity: 0.8 }] },
        createMarker: function() { return null; } // Custom markers handled elsewhere
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const route = e.routes[0];
        const distKm = (route.summary.totalDistance / 1000).toFixed(1);
        let timeMin = Math.round(route.summary.totalTime / 60);
        
        // Mode adjustments
        if(currentMode === 'bike') timeMin = Math.round(timeMin * 0.8);
        if(currentMode === 'bus') timeMin = Math.round(timeMin * 1.4);

        document.getElementById("route-results-area").style.display = "block";
        document.getElementById("route-dist").textContent = distKm + " km";
        document.getElementById("route-time").textContent = timeMin + " min";
        document.getElementById("saving-time").textContent = Math.round(timeMin * 0.25) + " min saved";
        document.getElementById("route-path-display").textContent = `${originEl.value} → ${dest.display_name.split(',')[0]}`;
        
        // Simulated intelligence reason
        const reasons = ["Optimized via main arterials.", "Avoiding minor congestion ahead.", "Fastest path for current mode."];
        document.getElementById("route-reason").textContent = reasons[Math.floor(Math.random()*reasons.length)];
        
        // --- RESTORE CHART ---
        const directTime = Math.round(timeMin * 1.25); // Assume 25% slower on standard route
        if(routeChart) routeChart.destroy();
        routeChart = new Chart(document.getElementById("routeChartSmall").getContext("2d"), {
          type: 'bar',
          data: {
            labels: ['Standard', 'AeroPath'],
            datasets: [{
              data: [directTime, timeMin],
              backgroundColor: ['rgba(248,81,73,0.3)', 'rgba(26,115,232,0.5)'],
              borderColor: ['#f85149', '#1a73e8'],
              borderWidth: 1
            }]
          },
          options: { 
            indexAxis: 'y', 
            plugins: { legend: { display: false } },
            scales: { x: { display: false }, y: { ticks: { color: '#8b949e', font: {size: 9} } } } 
          }
        });
        
        speak(`Route found to ${dest.display_name.split(',')[0]}. Distance ${distKm} kilometers. Saving ${Math.round(timeMin * 0.25)} minutes.`);
      });
    }

    // --- INIT ---
    document.getElementById('user-email').textContent = localStorage.getItem('user_email') || 'admin';
    const map = L.map("map",{zoomControl:false}).setView([12.965,77.595],13);
    L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}", { attribution: "&copy; Google Maps" }).addTo(map);
    detectLocation();
    setLang('en');

    function logout() { localStorage.clear(); window.location.href='login.html'; }

    // --- CHATBOT ENHANCEMENT ---
    async function chat(presetMsg) {
      const msg = presetMsg || document.getElementById("cm").value;
      if(!msg) return;
      document.getElementById("cr").innerHTML = "<i>AI is thinking...</i>";
      
      // Feed context: current destination and mode
      const dest = document.getElementById("route-dest-search").value;
      const context = `(User is traveling to ${dest || 'unknown'} via ${currentMode})`;
      
      const res = await fetch(API+"/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ message: msg + " " + context })
      }).then(r=>r.json());
      
      document.getElementById("cr").innerHTML = `<b>AI:</b> ${res.reply}`;
      
      // Add suggestion chips
      if(dest) {
        document.getElementById("cr").innerHTML += `<div class="chips">
          <button onclick="chat('Suggest cafes near ${dest}')">☕ Cafes</button>
          <button onclick="chat('Is ${currentMode} safe for this route?')">🛡 Safety</button>
        </div>`;
      }
    }
    // --- DATA UPDATES ---
    async function updateData() {
      const data = await fetch(API+"/api/dashboard/data").then(r=>r.json());
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
      document.getElementById("density-val").textContent = Math.floor(Math.random()*30 + 40) + "%";
      
      let html = "";
      data.junctions.forEach(j => {
        const col = j.congestion === 'HIGH' ? '#f85149' : (j.congestion === 'MEDIUM' ? '#d29922' : '#3fb950');
        if(markers[j.id]) {
          markers[j.id].setStyle({color: col, fillColor: col});
        } else {
          markers[j.id] = L.circleMarker([j.lat, j.lng], {radius: 12, weight: 2, color: col, fillColor: col, fillOpacity: 0.6})
            .addTo(map).bindPopup(`<b>${j.name}</b><br>${j.weather.icon} ${j.weather.condition}<br>📌 ${j.intel.cause}`);
        }
        html += `<div class="junction-pill" style="border-left: 3px solid ${col}">
                   <div class="j-name">${j.name}</div>
                   <div class="j-stat">${j.weather.icon} ${j.weather.temperature_c}°C</div>
                 </div>`;
      });
      document.getElementById("junction-list").innerHTML = html;

      // Ambulance
      if(data.ambulance && data.ambulance.lat) {
        if(!ambulanceMarker) {
          ambulanceMarker = L.marker([data.ambulance.lat, data.ambulance.lng], {
            icon: L.divIcon({html: "<div class='amb-icon'>🚑</div>", className: ""})
          }).addTo(map);
        } else {
          ambulanceMarker.setLatLng([data.ambulance.lat, data.ambulance.lng]);
        }
        document.getElementById("active-ambulance-alert").style.display = data.ambulance.active ? "block" : "none";
      }
    }

    // --- WIDGETS ---
    function toggleWidget(type) {
      const panel = document.getElementById("widget-panel");
      if(!type || panel.dataset.current === type) {
        panel.style.display = "none";
        panel.dataset.current = "";
        return;
      }
      panel.style.display = "flex";
      panel.dataset.current = type;
      document.getElementById("widget-title").textContent = type.toUpperCase();
      let content = "";
      if(type === 'telemetry') {
        content = '<div id="log-con" class="console"></div>';
        fetch(API+"/api/telemetry/log").then(r=>r.json()).then(logs => {
          document.getElementById("log-con").innerHTML = logs.map(l => `[${l.timestamp}] ${l.source}: ${l.payload}`).join('<br>');
        });
      } else if(type === 'forecast') {
        content = '<div id="fc-area">Loading...</div>';
      } else if(type === 'chatbot') {
        content = '<div class="chat-simple"><input id="cm" placeholder="Ask AI..."><button onclick="chat()">➤</button><div id="cr"></div></div>';
      }
      document.getElementById("widget-content").innerHTML = content;
    }

    function speak(t) { if(document.getElementById("voice-toggle").checked) speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    setInterval(updateData, 5000);
    updateData();
  </script>
</body>
</html>
