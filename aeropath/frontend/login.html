<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroPath Login — Traffic Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #05070a;
      --accent-blue: #58a6ff;
      --text-main: #e6edf3;
      --text-dim: #8b949e;
      --border: rgba(48, 54, 61, 0.5);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 50%, rgba(88, 166, 255, 0.05) 0%, transparent 70%);
    }
    .login-container {
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
    
    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .tagline { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; letter-spacing: 0.5px; }
    
    .input-group { text-align: left; margin-bottom: 20px; }
    label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent-blue); }
    
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }
    
    .footer-links { margin-top: 24px; font-size: 12px; color: var(--text-dim); }
    .footer-links span { color: var(--accent-blue); cursor: pointer; font-weight: 600; }
    
    .tabs { display: flex; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-dim); transition: 0.3s; }
    .tab.active { background: var(--accent-blue); color: #fff; }

    /* Form Fields Container */
    .form-section { display: none; text-align: left; }
    .form-section.active { display: block; animation: slideIn 0.3s forwards; }
    @keyframes slideIn { from{opacity:0; transform:translateX(-10px)} to{opacity:1; transform:translateX(0)} }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">AeroPath AI</div>
    <p class="tagline">URBAN TRAFFIC INTELLIGENCE COMMAND</p>
    
    <!-- Tab Controls -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('user')">Private User</div>
      <div class="tab" onclick="switchTab('ambulance')">Ambulance Driver</div>
    </div>

    <!-- User Form -->
    <div id="form-user" class="form-section active">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="u-name" placeholder="John Doe">
      </div>
      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="u-phone" placeholder="+91 98765 43210">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="u-email" placeholder="name@company.com" value="user@aeropath.ai">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="u-pass" placeholder="••••••••" value="password123">
      </div>
    </div>

    <!-- Ambulance Form -->
    <div id="form-ambulance" class="form-section">
      <div class="input-group">
        <label>Driver Name</label>
        <input type="text" id="a-name" placeholder="Agent 47">
      </div>
      <div class="input-group">
        <label>Ambulance Registration No.</label>
        <input type="text" id="a-num" placeholder="KA-01-AM-1080" value="KA-01-AM-1080">
      </div>
      <div class="input-group">
        <label>Passcode / Token</label>
        <input type="password" id="a-pass" placeholder="••••••••" value="secure108">
      </div>
    </div>
    
    <button class="btn-login" onclick="login()">Enter Command Center</button>
    
    <div class="footer-links">
      Don't have access? <span>Request Authorization</span>
    </div>
  </div>

  <script>
    let currentRole = 'user';

    function switchTab(role) {
      currentRole = role;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('form-' + role).classList.add('active');
    }

    async function login() {
      // Mock validation
      let valid = false;
      let displayName = "";

      if (currentRole === 'user') {
        const email = document.getElementById('u-email').value;
        const pass = document.getElementById('u-pass').value;
        if (email && pass) { valid = true; displayName = email; }
      } else {
        const num = document.getElementById('a-num').value;
        const pass = document.getElementById('a-pass').value;
        if (num && pass) { valid = true; displayName = num; }
      }
      
      if (valid) {
        localStorage.setItem('aeropath_auth', 'true');
        localStorage.setItem('aeropath_role', currentRole);
        localStorage.setItem('user_email', displayName);
        
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.5s';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        alert('Please fill out all required credentials.');
      }
    }
  </script>
</body>
</html>
